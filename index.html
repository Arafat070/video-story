<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Video Story</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Экран с открыткой -->
    <div class="envelope-screen" id="envelopeScreen">
      <div class="particles" id="particles"></div>

      <div class="envelope-wrapper">
        <div class="envelope" id="envelope">
          <div class="envelope-back"></div>
          <div class="envelope-flap" id="envelopeFlap"></div>
          <div class="letter" id="letter">
            <div class="letter-content">
              <div class="letter-ornament">✦</div>
              <h1 class="letter-title">Video Story</h1>
              <div class="letter-divider"></div>
              <p class="letter-subtitle">Приглашение</p>
              <p class="letter-text">
                Для Вас подготовлено<br />особенное видео
              </p>
              <div class="letter-ornament">✦</div>
            </div>
          </div>
          <div class="envelope-front">
            <div class="wax-seal">
              <span class="seal-letter">V</span>
            </div>
          </div>
        </div>

        <!-- Подсказка снизу под открыткой -->
        <div class="hint-bottom" id="hintBottom">
          <svg
            class="arrow-up"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 19V5" />
            <path d="M5 12l7-7 7 7" />
          </svg>
          <span>Откройте открытку</span>
        </div>
      </div>
    </div>

    <!-- Экран с видео -->
    <div class="video-screen" id="videoScreen">
      <div class="video-particles" id="videoParticles"></div>

      <div class="video-container">
        <div class="video-header">
          <div class="header-line"></div>
          <h2 class="video-title">Video Story</h2>
          <div class="header-line"></div>
        </div>

        <div class="video-wrapper" id="videoWrapper">
          <video
            id="mainVideo"
            playsinline
            webkit-playsinline
            preload="metadata"
          >
            <source src="video-story.MP4" type="video/mp4" />
            Ваш браузер не поддерживает видео.
          </video>

          <div class="video-overlay" id="videoOverlay">
            <button
              class="play-btn"
              id="playBtn"
              aria-label="Воспроизвести видео"
            >
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M8 5v14l11-7z" fill="currentColor" />
              </svg>
            </button>
            <p class="play-text">Нажмите, чтобы воспроизвести</p>
          </div>
        </div>

        <div class="video-footer">
          <div class="footer-ornament">❋</div>
          <p>Спасибо за просмотр</p>
          <div class="footer-ornament">❋</div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
